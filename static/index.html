<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181b18">
  <meta name="description" content="从招聘邮箱中提取笔试与面试安排，整理成一张清晰、可编辑的校招日程表。">
  <title>校招雷达 · campus-radar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="app-frame">
    <aside class="sidebar" id="sidebar" aria-label="侧边栏">
      <div class="sidebar-glow" aria-hidden="true"></div>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="14.5" stroke="currentColor" stroke-opacity=".28" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="8.5" stroke="currentColor" stroke-opacity=".52" stroke-width="1.5"/>
            <path d="M20 20 31.5 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="28.6" cy="11.4" r="3.4" fill="#f06a36"/>
            <circle cx="20" cy="20" r="1.8" fill="currentColor"/>
          </svg>
        </span>
        <div class="brand-copy">
          <span class="brand-name">校招雷达</span>
          <span class="brand-en">CAMPUS-RADAR</span>
        </div>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="关闭菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-nav="dashboard">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
              <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
            </svg>
          </span>
          <span class="nav-text">总览</span>
          <span class="nav-count" id="nav-count-upcoming" hidden></span>
        </button>
        <button class="nav-item" type="button" data-nav="library">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>
            </svg>
          </span>
          <span class="nav-text">日程</span>
          <span class="nav-count" id="nav-count-library" hidden></span>
        </button>
        <button class="nav-item" type="button" data-nav="accounts">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>
            </svg>
          </span>
          <span class="nav-text">邮箱</span>
          <span class="nav-count" id="nav-count-accounts" hidden></span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <section class="sync-card" aria-label="邮箱同步状态">
        <div class="sync-status-line">
          <span class="status-light" id="sync-light" aria-hidden="true"></span>
          <span class="sync-summary" id="sync-summary">尚未连接邮箱</span>
        </div>
        <button class="sidebar-sync-button" id="sidebar-sync-button" type="button" data-action="sync-all">
          <span id="sidebar-sync-label">连接招聘邮箱</span>
          <svg class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
          </svg>
        </button>
        <p class="sync-detail" id="sync-detail">授权码只保存在这台电脑上</p>
      </section>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="shell">
      <header class="mobile-header">
        <button class="icon-button" id="mobile-menu" type="button" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <span class="mobile-brand">校招雷达</span>
        <button class="icon-button" type="button" data-action="sync-all" aria-label="同步邮箱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </header>

      <main class="page" id="main" tabindex="-1">
        <div class="view-root" id="view-root" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="event-drawer" id="event-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

  <dialog class="confirm-dialog" id="confirm-dialog">
    <form method="dialog" class="confirm-card">
      <div class="confirm-mark" id="confirm-mark" aria-hidden="true"></div>
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button class="button button-ghost" value="cancel" type="submit">取消</button>
        <button class="button button-danger" id="confirm-button" value="confirm" type="submit">确认</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <div class="boot-screen" id="boot-screen">
    <div class="boot-radar" aria-hidden="true">
      <span class="boot-ring boot-ring-1"></span>
      <span class="boot-ring boot-ring-2"></span>
      <span class="boot-sweep"></span>
      <span class="boot-core"></span>
      <span class="boot-ping"></span>
    </div>
    <p class="boot-title">正在校准雷达</p>
    <p class="boot-copy">整理你的校招日程…</p>
  </div>

  <noscript>
    <div class="noscript-message">校招雷达需要启用 JavaScript 才能运行。</div>
  </noscript>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
